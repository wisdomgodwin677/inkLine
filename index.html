<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Iinkline is a notebook-style to-do app with due dates, filters, and dark mode.">
  <title>Iinkline: Write it down. Tick it off.</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="notebook">
    <header class="top">
      <h1>Today's Tasks</h1>
      <button id="theme-btn" aria-label="Toggle dark mode">🌙</button>
    </header>

    <div class="add-row">
      <input id="task-input" type="text" placeholder="Write a task..." aria-label="New task">
      <input id="due-input" type="date" aria-label="Due date (optional)">
      <button id="add-btn">Add</button>
    </div>

    <ul id="task-list"></ul>

    <footer class="footer">
      <span id="task-count"></span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clear-btn">🗑️ Clear completed</button>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
